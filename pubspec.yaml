name: cupertino_native_ui
description: >-
  Native iOS 26 Liquid Glass widgets for Flutter, backed by SwiftUI: glass
  effects, tab bar, toolbar, sheets, menus, lists and scroll edge effects.
version: 0.2.0
homepage: https://github.com/ru-ji/cupertino_native_ui
repository: https://github.com/ru-ji/cupertino_native_ui
issue_tracker: https://github.com/ru-ji/cupertino_native_ui/issues
topics:
  - liquid-glass
  - cupertino
  - ios
  - swiftui
  - native-widgets
screenshots:
  - description: Liquid Glass morphing between two glasses
    path: doc/images/reshape.gif
  - description: Liquid Glass swap transition
    path: doc/images/swap.gif
  - description: iOS 26 scroll edge effect
    path: doc/images/scroll_edge_effect.gif

environment:
  sdk: ^3.13.2
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterCupertinoPlugin

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
