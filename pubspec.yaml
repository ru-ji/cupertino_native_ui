name: cupertino_widgets
description: >-
  Real UIKit and SwiftUI controls for Flutter on iOS — native buttons, lists,
  sheets, tab bars, navigation and Liquid Glass, driven by a Flutter-shaped API.
version: 0.1.0
homepage: https://github.com/ru-ji/cupertino_widgets
repository: https://github.com/ru-ji/cupertino_widgets
issue_tracker: https://github.com/ru-ji/cupertino_widgets/issues

environment:
  sdk: ^3.10.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Local while the scroll edge effect's tint profile is being tuned against
  # the system's — see CupertinoScrollEdgeEffect. Back to a hosted version
  # before publishing: a path dependency cannot be published.
  haze:
    path: ../haze

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterCupertinoPlugin

  shaders:
    - shaders/haze.frag

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
