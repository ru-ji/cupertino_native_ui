name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # pub.dev's score comes from static analysis only, so these two mirror
      # what pana will check at publish time.
      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # pub.dev never runs these: this workflow is the only thing that does.
      - name: Test
        run: flutter test

      # The example is the visual test bed: it must at least analyze.
      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

  # Nothing else compiles the Swift: a type error there would only show up in
  # an app build. Typechecks every source against the real Flutter framework.
  # The iOS 27 branches (`#if compiler(>=6.4)`) are only checked when the
  # runner's Xcode is 27 or later.
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter precache --ios
      - name: Typecheck Swift
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          FRAMEWORK="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework/ios-arm64_x86_64-simulator"
          xcrun swift --version
          find ios/cupertino_native_ui/Sources -name '*.swift' -print0 \
            | xargs -0 xcrun -sdk iphonesimulator swiftc -typecheck \
                -target arm64-apple-ios15.0-simulator -F "$FRAMEWORK"

  # Reports the same score pub.dev will show, so surprises land here first.
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning --exit-code-threshold 20 .
