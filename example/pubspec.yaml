name: cupertino_widgets_example
description: Demonstrates how to use the cupertino_widgets plugin.
version: 1.0.0+1
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.2
  flutter: ">=1.17.0"

dependencies:
  # Used only by the edge-effect isolation probe.
  haze:
    path: ../../haze
  flutter:
    sdk: flutter
  cupertino_widgets:
    path: ../
  # Bundles the CupertinoIcons font so CupertinoIcons glyphs can render
  # natively (the native side loads bundled icon fonts by family name).
  cupertino_icons: ^1.0.8
  inspire_blur: ^0.4.0
  progressive_blur: ^0.0.2
  soft_edge_blur: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
